<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="60%" stop-color="#070a10"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>

    <!-- Emerald-to-Cyan Main Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Electric Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filter for subtle drop-glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Hexagonal Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Border -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#shieldBorder)" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Inner Ambient Glow Background Circle -->
  <circle cx="256" cy="256" r="160" fill="url(#coreGlow)"/>

  <!-- Geometric Circuit Lines (Precision Tech Backdrop) -->
  <g stroke="#10b981" stroke-width="1.5" stroke-opacity="0.25" stroke-linecap="round">
    <path d="M 120 160 L 170 160 L 200 190" />
    <circle cx="120" cy="160" r="3" fill="#10b981" fill-opacity="0.5" />
    <path d="M 392 160 L 342 160 L 312 190" />
    <circle cx="392" cy="160" r="3" fill="#06b6d4" fill-opacity="0.5" />
    <path d="M 140 360 L 190 360 L 220 330" />
    <circle cx="140" cy="360" r="3" fill="#10b981" fill-opacity="0.5" />
    <path d="M 372 360 L 322 360 L 292 330" />
    <circle cx="372" cy="360" r="3" fill="#06b6d4" fill-opacity="0.5" />
  </g>

  <!-- Outer Cybernetic Shield -->
  <path d="M 256 86
           L 384 146
           L 384 274
           C 384 344 328 398 256 426
           C 184 398 128 344 128 274
           L 128 146
           Z"
        fill="#08101a"
        stroke="url(#shieldBorder)"
        stroke-width="5"
        stroke-linejoin="round"/>

  <!-- Left Code Bracket / Anvil Wing (UA Input / Client Wing) -->
  <path d="M 214 176
           L 164 226
           L 164 256
           L 214 306
           L 230 290
           L 190 250
           L 190 232
           L 230 192
           Z"
        fill="url(#brandGrad)"
        filter="url(#glow)"/>

  <!-- Right Code Bracket / Anvil Wing (Normalized Output Wing) -->
  <path d="M 298 176
           L 348 226
           L 348 256
           L 298 306
           L 282 290
           L 322 250
           L 322 232
           L 282 192
           Z"
        fill="url(#accentGrad)"
        filter="url(#glow)"/>

  <!-- Central Forge Monogram Symbol (Forged 'U' & 'A' Core) -->
  <!-- Upper Anvil Bar / Cross-Platform Bridge -->
  <path d="M 210 200
           L 302 200
           C 308 200 312 204 310 210
           L 298 238
           C 296 242 292 244 288 244
           L 224 244
           C 220 244 216 242 214 238
           L 202 210
           C 200 204 204 200 210 200
           Z"
        fill="url(#brandGrad)"/>

  <!-- Center Anvil / Forge Pillar & Core Diamond -->
  <path d="M 236 254
           L 276 254
           L 286 310
           L 256 348
           L 226 310
           Z"
        fill="#0f2b26"
        stroke="url(#brandGrad)"
        stroke-width="3.5"
        stroke-linejoin="round"/>

  <!-- Glowing Heart/Spark Matrix Diamond -->
  <polygon points="256,268 270,284 256,300 242,284" fill="#6ee7b7" filter="url(#glow)"/>

  <!-- Crown Node: Security & Consensus Indicator -->
  <circle cx="256" cy="144" r="8" fill="#34d399" filter="url(#glow)" />
  <circle cx="256" cy="144" r="4" fill="#ffffff" />

  <!-- Base Forge Tip Dot -->
  <circle cx="256" cy="380" r="5" fill="#38bdf8" filter="url(#glow)" />
</svg>
